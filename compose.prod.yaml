# PRODUCTION: immutable application image + persistent named SQLite volume.
services:
  app:
    build:
      context: .
      target: production
    container_name: fss-glpi-app
    env_file:
      - .env
    environment:
      APP_DB_PATH: /app/data/app.sqlite3
      PORT: "8000"
    ports:
      - "127.0.0.1:${APP_PORT:-8000}:8000"
    volumes:
      - fss_glpi_data:/app/data
    extra_hosts:
      - "glpi.local:host-gateway"
    init: true
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  fss_glpi_data:
